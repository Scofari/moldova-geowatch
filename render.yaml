services:
  - type: web
    name: moldova-geowatch
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
