services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: geowatch
      POSTGRES_USER: geowatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geowatch_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - geowatch_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geowatch -d geowatch']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  geowatch_db:
